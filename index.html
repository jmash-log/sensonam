<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IEEE Sensors Council — Sensor Puzzle</title>


<style>

    /* =========================================================
       IEEE SENSORS COUNCIL — SENSOR QUEST
       VISUAL DESIGN SYSTEM ONLY
       No content / logic changes
    ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;500;600;700;800&family=Black+Han+Sans&display=swap');


    /* =========================================================
       DESIGN TOKENS
    ========================================================= */

    :root {

        --primary-blue: #0076CE;
        --primary-blue-dark: #005FA8;
        --primary-blue-light: #E5F3FF;

        --accent-gold: #FCD14D;
        --accent-gold-light: #FFF4C4;

        --background: #F2F8FE;
        --surface: #FFFFFF;

        --grid-border: #D4E8FA;

        --charcoal: #1E1E1E;
        --muted: #667789;
        --muted-light: #8A9AAC;

        --success: #168447;
        --success-light: #EAF8F0;

        --failure: #D64545;
        --failure-light: #FFF0F0;

        --shadow-soft:
            0 10px 30px rgba(0, 73, 130, 0.08);

        --shadow-card:
            0 18px 45px rgba(0, 73, 130, 0.12);

        --shadow-blue:
            0 8px 20px rgba(0, 118, 206, 0.20);

        --radius-card: 20px;
        --radius-tile: 14px;
        --radius-pill: 24px;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {

        box-sizing: border-box;

        margin: 0;

        padding: 0;

    }


    html {

        min-height: 100%;

    }


    body {

        min-height: 100vh;

        color: var(--charcoal);

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 24px;

        position: relative;

        overflow-x: hidden;

        background:

            linear-gradient(
                rgba(242, 248, 254, 0.94),
                rgba(242, 248, 254, 0.94)
            ),

            repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 58px,
                rgba(212, 232, 250, 0.75) 59px,
                rgba(212, 232, 250, 0.75) 60px
            ),

            repeating-linear-gradient(
                90deg,
                transparent 0,
                transparent 58px,
                rgba(212, 232, 250, 0.75) 59px,
                rgba(212, 232, 250, 0.75) 60px
            );

    }


    /* Decorative background blocks */

    body::before {

        content: "";

        position: fixed;

        width: 260px;

        height: 260px;

        top: -120px;

        right: -100px;

        background: var(--accent-gold);

        opacity: 0.15;

        border-radius: 40px;

        transform: rotate(18deg);

        pointer-events: none;

    }


    body::after {

        content: "";

        position: fixed;

        width: 220px;

        height: 220px;

        bottom: -120px;

        left: -100px;

        background: var(--primary-blue);

        opacity: 0.08;

        border-radius: 40px;

        transform: rotate(-18deg);

        pointer-events: none;

    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .container {

        width: 100%;

        max-width: 720px;

        text-align: center;

        position: relative;

        z-index: 1;

        padding: 28px 24px 24px;

        background: rgba(255, 255, 255, 0.76);

        border: 2px solid var(--grid-border);

        border-radius: 24px;

        box-shadow: var(--shadow-card);

        backdrop-filter: blur(10px);

    }


    /* =========================================================
       EYEBROW
    ========================================================= */

    .eyebrow {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        padding: 7px 17px;

        margin-bottom: 12px;

        background: var(--primary-blue);

        color: #FFFFFF;

        border-radius: var(--radius-pill);

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 11px;

        font-weight: 800;

        letter-spacing: 2px;

        text-transform: uppercase;

        box-shadow: var(--shadow-blue);

    }


    /* =========================================================
       MAIN TITLE
    ========================================================= */

    h1 {

        font-family:
            "Black Han Sans",
            "Bebas Neue",
            Impact,
            sans-serif;

        font-size:
            clamp(38px, 7vw, 58px);

        line-height: 0.95;

        letter-spacing: 2px;

        text-transform: uppercase;

        color: var(--primary-blue);

        margin-bottom: 10px;

        text-shadow:
            3px 3px 0 var(--accent-gold);

    }


    .subtitle {

        color: var(--muted);

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 14px;

        font-weight: 600;

        margin-bottom: 22px;

        line-height: 1.5;

    }


    /* =========================================================
       LOGIN SCREEN
    ========================================================= */

    #loginScreen {

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        padding: 24px;

        background: var(--surface);

        border: 2px solid var(--grid-border);

        border-radius: var(--radius-card);

        box-shadow: var(--shadow-soft);

        position: relative;

        overflow: hidden;

    }


    #loginScreen::before {

        content: "";

        position: absolute;

        top: 0;

        left: 0;

        right: 0;

        height: 6px;

        background: var(--accent-gold);

    }


    #userIdInput {

        width: 100%;

        max-width: 570px;

        padding: 15px 18px;

        border-radius: 13px;

        border: 2px solid var(--grid-border);

        background: #F8FCFF;

        color: var(--charcoal);

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 14px;

        font-weight: 600;

        outline: none;

        text-align: center;

        margin-top: 4px;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;

    }


    #userIdInput::placeholder {

        color: var(--muted-light);

    }


    #userIdInput:focus {

        border-color: var(--primary-blue);

        background: #FFFFFF;

        box-shadow:
            0 0 0 4px rgba(0, 118, 206, 0.10);

    }


    #loginMessage {

        margin-top: 10px;

        color: var(--failure);

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 12px;

        font-weight: 700;

        min-height: 18px;

    }


    /* =========================================================
       WELCOME MESSAGE
    ========================================================= */

    #welcomeMessage {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        color: var(--primary-blue);

        background: var(--primary-blue-light);

        border: 1px solid var(--grid-border);

        border-radius: var(--radius-pill);

        padding: 8px 18px;

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 13px;

        font-weight: 800;

        margin-bottom: 12px;

    }


    /* =========================================================
       TOP BAR
    ========================================================= */

    .top-bar {

        display: flex;

        justify-content: center;

        align-items: center;

        margin-bottom: 14px;

    }


    /* =========================================================
       TIMER PILL
    ========================================================= */

    .timer-box {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        background: var(--primary-blue);

        color: #FFFFFF;

        border: none;

        border-radius: var(--radius-pill);

        padding: 9px 22px;

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 12px;

        font-weight: 700;

        box-shadow: var(--shadow-blue);

    }


    .timer-box strong {

        color: #FFFFFF;

        font-family:
            "Bebas Neue",
            Impact,
            sans-serif;

        font-size: 19px;

        letter-spacing: 1px;

    }


    /* =========================================================
       PUZZLE WRAPPER
    ========================================================= */

    .puzzle-wrapper {

        width:
            min(92vw, 570px);

        margin: 0 auto;

    }


    /* =========================================================
       PUZZLE FRAME
    ========================================================= */

    .puzzle {

        width: 100%;

        aspect-ratio: 1 / 1;

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 9px;

        padding: 14px;

        background: var(--surface);

        border: 10px solid var(--accent-gold);

        border-radius: 20px;

        box-shadow:

            0 0 0 2px var(--primary-blue),

            0 18px 45px rgba(0, 73, 130, 0.15);

        position: relative;

    }


    /* =========================================================
       PUZZLE INNER GRID
    ========================================================= */

    .puzzle::before {

        content: "";

        position: absolute;

        inset: 4px;

        border-radius: 10px;

        border: 1px solid rgba(212, 232, 250, 0.65);

        pointer-events: none;

    }


    /* =========================================================
       SENSOR TILES
    ========================================================= */

    .tile {

        aspect-ratio: 1 / 1;

        background:

            linear-gradient(
                145deg,
                #FFFFFF,
                #F3F9FE
            );

        border: 2px solid var(--grid-border);

        border-radius: var(--radius-tile);

        overflow: hidden;

        display: flex;

        justify-content: center;

        align-items: center;

        cursor: grab;

        user-select: none;

        -webkit-user-select: none;

        position: relative;

        box-shadow:
            0 4px 12px rgba(0, 73, 130, 0.06);

        transition:
            transform 0.18s ease,
            border-color 0.18s ease,
            box-shadow 0.18s ease,
            background 0.18s ease;

    }


    .tile::after {

        content: "";

        position: absolute;

        inset: 0;

        border-radius: inherit;

        background:
            linear-gradient(
                135deg,
                rgba(0, 118, 206, 0.04),
                transparent 60%
            );

        pointer-events: none;

    }


    .tile img {

        width: 100%;

        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;

        position: relative;

        z-index: 1;

    }


    .tile:hover {

        transform:
            translateY(-3px);

        border-color:
            var(--primary-blue);

        box-shadow:

            0 8px 18px
            rgba(0, 118, 206, 0.15);

    }


    .tile:active {

        cursor: grabbing;

    }


    .tile.dragging {

        opacity: 0.4;

        transform:
            scale(0.95);

    }


    .tile.drag-over {

        border-color:
            var(--accent-gold);

        box-shadow:

            0 0 0 3px
            rgba(252, 209, 77, 0.35);

        transform:
            scale(0.96);

    }


    .tile.selected {

        border-color:
            var(--primary-blue);

        box-shadow:

            0 0 0 4px
            rgba(0, 118, 206, 0.18),

            0 8px 20px
            rgba(0, 118, 206, 0.16);

        transform:
            scale(0.96);

        background:
            var(--primary-blue-light);

    }


    /* =========================================================
       SUBMIT / PRIMARY BUTTON
    ========================================================= */

    .submit-button {

        width: 100%;

        max-width: 570px;

        margin-top: 15px;

        padding: 14px 22px;

        border: none;

        border-radius: var(--radius-pill);

        background:
            var(--primary-blue);

        color: #FFFFFF;

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 13px;

        font-weight: 900;

        letter-spacing: 1.2px;

        cursor: pointer;

        box-shadow:
            0 7px 18px
            rgba(0, 118, 206, 0.22);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease,
            background 0.18s ease,
            opacity 0.18s ease;

    }


    .submit-button:hover {

        background:
            var(--primary-blue-dark);

        transform:
            translateY(-2px);

        box-shadow:
            0 10px 24px
            rgba(0, 118, 206, 0.27);

    }


    .submit-button:active {

        transform:
            translateY(0);

        box-shadow:
            0 4px 12px
            rgba(0, 118, 206, 0.18);

    }


    .submit-button:disabled {

        opacity: 0.55;

        cursor: not-allowed;

        transform: none;

        box-shadow: none;

    }


    /* =========================================================
       RESULT CARD
    ========================================================= */

    .puzzle-result {

        grid-column: 1 / -1;

        grid-row: 1 / -1;

        width: 100%;

        height: 100%;

        border-radius: 14px;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        padding: 18px;

        overflow: hidden;

    }


    /* =========================================================
       SUCCESS
    ========================================================= */

    .puzzle-result.success {

        background:
            var(--success-light);

        border:
            3px solid var(--success);

        box-shadow:
            inset 0 0 0 5px rgba(22, 132, 71, 0.05);

    }


    .puzzle-result.success .result-title {

        color: var(--success);

    }


    .result-title {

        font-family:
            "Black Han Sans",
            "Bebas Neue",
            Impact,
            sans-serif;

        font-size:
            clamp(22px, 5vw, 34px);

        font-weight: 900;

        letter-spacing: 1.5px;

        text-transform: uppercase;

        margin-bottom: 7px;

    }


    .result-time {

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size:
            clamp(14px, 3vw, 19px);

        font-weight: 700;

        color: var(--charcoal);

        margin-bottom: 12px;

    }


    .result-message {

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size:
            clamp(12px, 2.5vw, 15px);

        font-weight: 600;

        color: var(--muted);

        line-height: 1.4;

    }


    /* =========================================================
       MAVELI FEATURED IMAGE
    ========================================================= */

    .maveli-image {

        width: 72%;

        height: 52%;

        object-fit: contain;

        display: block;

        margin: 4px 0 10px;

        border-radius: 12px;

        border: 8px solid var(--accent-gold);

        background: #FFFFFF;

        box-shadow:
            0 8px 22px rgba(0, 73, 130, 0.12);

    }


    /* =========================================================
       FAILURE
    ========================================================= */

    .puzzle-result.failure {

        background:
            var(--failure-light);

        border:
            3px solid var(--failure);

    }


    .puzzle-result.failure .result-title {

        color: var(--failure);

    }


    .attempt-over {

        margin-top: 12px;

        padding: 8px 16px;

        border-radius: var(--radius-pill);

        background:
            var(--failure);

        color: #FFFFFF;

        font-family:
            "Bebas Neue",
            Impact,
            sans-serif;

        font-size: 13px;

        letter-spacing: 1.5px;

        box-shadow:
            0 5px 12px
            rgba(214, 69, 69, 0.18);

    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {

        opacity: 0.6;

        pointer-events: none;

    }


    /* =========================================================
       INSTRUCTIONS
    ========================================================= */

    .instructions {

        margin-top: 12px;

        padding: 10px 14px;

        color: var(--muted);

        background:
            rgba(255, 255, 255, 0.78);

        border:
            1px solid var(--grid-border);

        border-radius: 12px;

        font-family:
            "Nunito",
            system-ui,
            sans-serif;

        font-size: 11px;

        font-weight: 600;

        line-height: 1.55;

    }


    .instructions strong {

        color: var(--primary-blue);

        font-weight: 800;

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 520px) {

        body {

            padding: 10px;

            align-items: flex-start;

        }


        .container {

            padding:
                22px
                12px
                16px;

            margin-top: 4px;

            border-radius: 20px;

        }


        .eyebrow {

            font-size: 9px;

            letter-spacing: 1.7px;

            padding:
                6px 14px;

            margin-bottom: 10px;

        }


        h1 {

            font-size:
                clamp(34px, 11vw, 46px);

            letter-spacing: 1.5px;

            margin-bottom: 8px;

        }


        .subtitle {

            font-size: 12px;

            margin-bottom: 16px;

        }


        #loginScreen {

            padding: 20px 14px;

            border-radius: 16px;

        }


        #userIdInput {

            padding: 13px 15px;

        }


        .top-bar {

            margin-bottom: 10px;

        }


        .timer-box {

            padding:
                8px 18px;

        }


        .puzzle-wrapper {

            width: 94vw;

            max-width: 570px;

        }


        .puzzle {

            gap: 5px;

            padding: 8px;

            border-width: 7px;

            border-radius: 16px;

        }


        .tile {

            border-radius: 9px;

            border-width: 1.5px;

        }


        .submit-button {

            margin-top: 11px;

            padding: 12px;

            font-size: 12px;

        }


        .instructions {

            margin-top: 8px;

            padding: 8px 10px;

            font-size: 9.5px;

        }


        .maveli-image {

            width: 80%;

            height: 55%;

            border-width: 6px;

        }

    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-width: 360px) {

        body {

            padding: 6px;

        }


        .container {

            padding:
                18px
                8px
                12px;

        }


        h1 {

            font-size: 32px;

        }


        .subtitle {

            font-size: 11px;

        }


        #loginScreen {

            padding: 17px 10px;

        }


        .puzzle {

            gap: 4px;

            padding: 6px;

            border-width: 6px;

        }


        .instructions {

            font-size: 9px;

        }

    }

</style>

</head>


<body>


<main class="container">


    <div class="eyebrow">
        IEEE Sensors Council
    </div>


    <h1>
        Sensor Quest
    </h1>


    <p class="subtitle">
        Arrange the sensors by communication protocol.
    </p>


    <!-- =========================================
         LOGIN SCREEN
    ========================================== -->

    <div id="loginScreen">

        <input
            id="userIdInput"
            type="text"
            placeholder="Enter User ID"
            autocomplete="off"
        >


        <button
            class="submit-button"
            id="startButton"
            type="button"
        >
            START PUZZLE
        </button>


        <p id="loginMessage"></p>

    </div>


    <!-- =========================================
         GAME SCREEN
    ========================================== -->

    <div
        class="puzzle-wrapper"
        id="gameScreen"
        style="display: none;"
    >


        <div id="welcomeMessage"></div>


        <div class="top-bar">

            <div class="timer-box">

                Time:

                <strong id="timer">
                    00:00.00
                </strong>

            </div>

        </div>


        <!-- =========================================
             PUZZLE
        ========================================== -->

        <div
            class="puzzle"
            id="puzzle"
        >


            <!-- I²C -->

            <div
                class="tile"
                draggable="true"
                data-id="pc1"
                data-protocol="i2c"
            >

                <img
                    src="pc1.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc2"
                data-protocol="i2c"
            >

                <img
                    src="pc2.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc3"
                data-protocol="i2c"
            >

                <img
                    src="pc3.webp"
                    alt="I2C sensor"
                >

            </div>


            <!-- 1-WIRE -->

            <div
                class="tile"
                draggable="true"
                data-id="onewire1"
                data-protocol="onewire"
            >

                <img
                    src="1-wire1.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire2"
                data-protocol="onewire"
            >

                <img
                    src="1-wire2.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire3"
                data-protocol="onewire"
            >

                <img
                    src="1-wire3.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <!-- UART -->

            <div
                class="tile"
                draggable="true"
                data-id="uart1"
                data-protocol="uart"
            >

                <img
                    src="uart1.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart2"
                data-protocol="uart"
            >

                <img
                    src="uart2.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart3"
                data-protocol="uart"
            >

                <img
                    src="uart3.webp"
                    alt="UART sensor"
                >

            </div>

        </div>


        <button
            class="submit-button"
            id="submitButton"
            type="button"
        >
            SUBMIT PUZZLE
        </button>


        <p class="instructions">

            <strong>Desktop:</strong>
            drag one tile onto another to swap.

            <br>

            <strong>Phone:</strong>
            tap one tile, then tap another tile to swap.

        </p>


    </div>


</main>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

/*
 * IMPORTANT:
 *
 * Replace ONLY the text below.
 *
 * It must look like:
 *
 * https://script.google.com/macros/s/XXXXXXXXXXXX/exec
 *
 * Do NOT put the Google Apps Script editor URL here.
 */

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxMjUaXm4xjNxdlDrXZOC-oMN4qPu_UPOFkDqdrqzTsyPsGBanhVZGBxRfIkrtAQS-Ciw/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const puzzle =
    document.getElementById("puzzle");

const submitButton =
    document.getElementById("submitButton");

const timerDisplay =
    document.getElementById("timer");

const loginScreen =
    document.getElementById("loginScreen");

const gameScreen =
    document.getElementById("gameScreen");

const userIdInput =
    document.getElementById("userIdInput");

const startButton =
    document.getElementById("startButton");

const loginMessage =
    document.getElementById("loginMessage");

const welcomeMessage =
    document.getElementById("welcomeMessage");


/* =========================================================
   GAME STATE
========================================================= */

let draggedTile = null;

let selectedTile = null;

let submitted = false;

let currentUserId = "";

let currentUserName = "";

let moveCount = 0;

let gameStarted = false;


/* =========================================================
   TIMER
========================================================= */

let startTime = 0;

let timerRunning = false;


function updateTimer() {

    if (!timerRunning) {
        return;
    }


    const elapsed =
        performance.now() -
        startTime;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    const seconds =
        Math.floor(
            (elapsed % 60000) / 1000
        );


    const milliseconds =
        Math.floor(
            elapsed % 1000
        );


    timerDisplay.textContent =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0")

        + "." +

        String(milliseconds)
            .padStart(3, "0")
            .slice(0, 2);


    requestAnimationFrame(
        updateTimer
    );

}


/* =========================================================
   API
========================================================= */

async function callAPI(payload) {

    if (
        !SCRIPT_URL ||
        SCRIPT_URL.includes(
            "PASTE_YOUR_APPS_SCRIPT"
        )
    ) {

        throw new Error(
            "Apps Script URL has not been configured."
        );

    }


    const response =
        await fetch(
            SCRIPT_URL,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "Empty response from Apps Script."
        );

    }


    try {

        return JSON.parse(text);

    }

    catch (error) {

        console.error(
            "Apps Script returned:",
            text
        );

        throw new Error(
            "Apps Script returned an invalid response."
        );

    }

}


/* =========================================================
   RANDOMIZE PUZZLE
========================================================= */

function randomizePuzzle() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    for (
        let i = tiles.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            tiles[i],
            tiles[randomIndex]
        ] =
        [
            tiles[randomIndex],
            tiles[i]
        ];

    }


    tiles.forEach(
        function(tile) {

            puzzle.appendChild(tile);

        }
    );

}


/* =========================================================
   DRAG EVENTS
========================================================= */

function setupDragEvents(tile) {

    tile.addEventListener(
        "dragstart",
        function() {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            draggedTile = tile;

            tile.classList.add(
                "dragging"
            );

        }
    );


    tile.addEventListener(
        "dragend",
        function() {

            tile.classList.remove(
                "dragging"
            );

            draggedTile = null;


            document
                .querySelectorAll(".tile")
                .forEach(
                    function(item) {

                        item.classList.remove(
                            "drag-over"
                        );

                    }
                );

        }
    );


    tile.addEventListener(
        "dragover",
        function(event) {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            event.preventDefault();


            if (
                tile !== draggedTile
            ) {

                tile.classList.add(
                    "drag-over"
                );

            }

        }
    );


    tile.addEventListener(
        "dragleave",
        function() {

            tile.classList.remove(
                "drag-over"
            );

        }
    );


    tile.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            tile.classList.remove(
                "drag-over"
            );


            if (
                submitted ||
                !gameStarted ||
                !draggedTile ||
                draggedTile === tile
            ) {
                return;
            }


            swapTiles(
                draggedTile,
                tile
            );

        }
    );

}


/* =========================================================
   MOBILE TAP
========================================================= */

function setupTouchSelection(tile) {

    tile.addEventListener(
        "click",
        function() {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            if (!selectedTile) {

                selectedTile = tile;

                tile.classList.add(
                    "selected"
                );

                return;

            }


            if (
                selectedTile === tile
            ) {

                tile.classList.remove(
                    "selected"
                );

                selectedTile = null;

                return;

            }


            swapTiles(
                selectedTile,
                tile
            );


            selectedTile.classList.remove(
                "selected"
            );

            selectedTile = null;

        }
    );

}


/* =========================================================
   SWAP
========================================================= */

function swapTiles(
    tileA,
    tileB
) {

    const placeholder =
        document.createElement(
            "div"
        );


    puzzle.insertBefore(
        placeholder,
        tileA
    );


    puzzle.insertBefore(
        tileA,
        tileB
    );


    puzzle.insertBefore(
        tileB,
        placeholder
    );


    puzzle.removeChild(
        placeholder
    );


    moveCount++;

}


/* =========================================================
   ARRANGEMENT
========================================================= */

function getArrangement() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    return tiles.map(
        function(tile) {

            return tile.dataset.protocol;

        }
    );

}


/* =========================================================
   LOCAL VALIDATION
========================================================= */

function validatePuzzle() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    if (
        tiles.length !== 9
    ) {

        return false;

    }


    const rows = [

        tiles.slice(0, 3),

        tiles.slice(3, 6),

        tiles.slice(6, 9)

    ];


    const rowProtocols = [];


    for (
        const row of rows
    ) {

        const protocols =
            row.map(
                tile =>
                    tile.dataset.protocol
            );


        if (
            protocols[0] !==
            protocols[1] ||

            protocols[1] !==
            protocols[2]
        ) {

            return false;

        }


        rowProtocols.push(
            protocols[0]
        );

    }


    const required = [
        "i2c",
        "onewire",
        "uart"
    ];


    rowProtocols.sort();

    required.sort();


    return (
        JSON.stringify(
            rowProtocols
        ) ===
        JSON.stringify(
            required
        )
    );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    finalTime
) {

    puzzle.innerHTML = `

        <div class="puzzle-result success">

            <div class="result-title">
                ✓ PUZZLE SOLVED
            </div>

            <div class="result-time">
                Completed in ${finalTime} seconds
            </div>

            <img
                class="maveli-image"
                src="maveli.webp"
                alt="Maveli"
            >

            <div class="result-message">
                Congratulations!
            </div>

        </div>

    `;

}


/* =========================================================
   FAILURE
========================================================= */

function showFailure() {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ INCORRECT
            </div>

            <div class="result-message">
                The sensor arrangement
                is incorrect.
            </div>

            <div class="attempt-over">
                ATTEMPT OVER
            </div>

        </div>

    `;

}


/* =========================================================
   ALREADY USED
========================================================= */

function showAlreadyUsed() {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ ALREADY USED
            </div>

            <div class="result-message">
                This User ID has already
                submitted an attempt.
            </div>

        </div>

    `;

}


/* =========================================================
   SERVER ERROR
========================================================= */

function showServerError(message) {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ SUBMISSION ERROR
            </div>

            <div class="result-message">
                ${message}
            </div>

        </div>

    `;

}


/* =========================================================
   START PUZZLE
========================================================= */

function startPuzzle() {

    loginScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    welcomeMessage.textContent =
        "Welcome, " +
        currentUserName +
        "!";


    submitted = false;

    selectedTile = null;

    draggedTile = null;

    moveCount = 0;

    gameStarted = false;


    submitButton.disabled =
        false;


    randomizePuzzle();


    initializeTiles();


    startTime =
        performance.now();


    timerRunning = true;

    gameStarted = true;


    updateTimer();

}


/* =========================================================
   LOGIN
========================================================= */

startButton.addEventListener(
    "click",
    async function() {

        const userId =
            userIdInput.value
                .trim();


        loginMessage.textContent =
            "";


        if (!userId) {

            loginMessage.textContent =
                "Please enter a User ID.";

            return;

        }


        startButton.disabled =
            true;

        startButton.classList.add(
            "loading"
        );

        startButton.textContent =
            "CHECKING...";


        try {

            const result =
                await callAPI({

                    action:
                        "checkUser",

                    userId:
                        userId

                });


            if (
                !result ||
                !result.success
            ) {

                if (
                    result &&
                    result.alreadyPlayed
                ) {

                    loginMessage.textContent =
                        "This User ID has already been used.";

                }

                else {

                    loginMessage.textContent =
                        result &&
                        result.message
                            ? result.message
                            : "Unable to verify User ID.";

                }

                return;

            }


            currentUserId =
                result.userId;

            currentUserName =
                result.name;


            startPuzzle();

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.textContent =
                error.message ===
                "Apps Script URL has not been configured."

                    ? "Apps Script URL has not been added to the HTML."

                    : "Unable to connect to the server. Check the Apps Script deployment.";

        }

        finally {

            startButton.disabled =
                false;

            startButton.classList.remove(
                "loading"
            );

            startButton.textContent =
                "START PUZZLE";

        }

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

userIdInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startButton.click();

        }

    }
);


/* =========================================================
   SUBMIT PUZZLE
========================================================= */

submitButton.addEventListener(
    "click",
    async function() {

        if (
            submitted ||
            !gameStarted
        ) {

            return;

        }


        timerRunning = false;


        const elapsed =
            performance.now() -
            startTime;


        const finalTime =
            Number(
                (
                    elapsed / 1000
                ).toFixed(2)
            );


        const arrangement =
            getArrangement();


        const locallyCorrect =
            validatePuzzle();


        submitted = true;

        gameStarted = false;

        submitButton.disabled =
            true;


        submitButton.textContent =
            "SUBMITTING...";


        try {

            const result =
                await callAPI({

                    action:
                        "submitResult",

                    result: {

                        userId:
                            currentUserId,

                        time:
                            finalTime,

                        moves:
                            moveCount,

                        arrangement:
                            arrangement

                    }

                });


            if (
                result &&
                result.success
            ) {

                if (
                    result.status ===
                    "SUCCESS"
                ) {

                    showSuccess(
                        result.time
                    );

                }

                else {

                    showFailure();

                }


                return;

            }


            if (
                result &&
                result.alreadyPlayed
            ) {

                showAlreadyUsed();

                return;

            }


            showServerError(
                result &&
                result.message
                    ? result.message
                    : "Unable to save your result."
            );


            console.error(
                "Submission rejected:",
                result
            );

        }

        catch (error) {

            console.error(
                "Submission error:",
                error
            );


            showServerError(
                "Your result could not be submitted. Please contact the event organizers."
            );

        }

    }
);


/* =========================================================
   INITIALIZE TILES
========================================================= */

function initializeTiles() {

    const tiles =
        puzzle.querySelectorAll(
            ".tile"
        );


    tiles.forEach(
        function(tile) {

            setupDragEvents(
                tile
            );

            setupTouchSelection(
                tile
            );

        }
    );

}
