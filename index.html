<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IEEE Sensors Council — Sensor Puzzle</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #0b0f14;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 16px;

        }


        .container {

            width: 100%;

            max-width: 720px;

            text-align: center;

        }


        .eyebrow {

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.55;

            margin-bottom: 8px;

        }


        h1 {

            font-size:
                clamp(27px, 5vw, 42px);

            margin-bottom: 6px;

        }


        .subtitle {

            color: #9da7b3;

            font-size: 14px;

            margin-bottom: 16px;

        }


        /* =========================================
           LOGIN
        ========================================== */

        #loginScreen {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        #userIdInput {

            width: 100%;

            max-width: 570px;

            padding: 14px 16px;

            border-radius: 10px;

            border: 1px solid #29313c;

            background: #171d25;

            color: #ffffff;

            font-size: 14px;

            outline: none;

            text-align: center;

            margin-top: 4px;

        }


        #userIdInput:focus {

            border-color: #667384;

        }


        #loginMessage {

            margin-top: 10px;

            color: #ff7777;

            font-size: 12px;

            min-height: 18px;

        }


        #welcomeMessage {

            color: #7dffad;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 14px;

        }


        /* =========================================
           TIMER
        ========================================== */

        .top-bar {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 14px;

        }


        .timer-box {

            background: #171d25;

            border: 1px solid #29313c;

            border-radius: 10px;

            padding: 8px 14px;

            font-size: 12px;

            color: #9da7b3;

        }


        .timer-box strong {

            color: #ffffff;

            font-size: 14px;

        }


        /* =========================================
           PUZZLE
        ========================================== */

        .puzzle-wrapper {

            width:
                min(92vw, 570px);

            margin: 0 auto;

        }


        .puzzle {

            width: 100%;

            aspect-ratio: 1 / 1;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            padding: 7px;

            background: #171d25;

            border: 1px solid #29313c;

            border-radius: 16px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.4);

        }


        /* =========================================
           TILES
        ========================================== */

        .tile {

            aspect-ratio: 1 / 1;

            background: #202833;

            border: 1px solid #343e4b;

            border-radius: 10px;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: grab;

            user-select: none;

            -webkit-user-select: none;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;

        }


        .tile img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

            pointer-events: none;

        }


        .tile:hover {

            transform:
                translateY(-2px);

            border-color:
                #667384;

        }


        .tile:active {

            cursor: grabbing;

        }


        .tile.dragging {

            opacity: 0.35;

            transform:
                scale(0.95);

        }


        .tile.drag-over {

            border-color:
                #ffffff;

            transform:
                scale(0.96);

        }


        .tile.selected {

            border-color:
                #ffffff;

            box-shadow:
                0 0 0 2px
                rgba(255,255,255,0.18);

            transform:
                scale(0.96);

        }


        /* =========================================
           SUBMIT BUTTON
        ========================================== */

        .submit-button {

            width: 100%;

            max-width: 570px;

            margin-top: 13px;

            padding: 13px 20px;

            border: none;

            border-radius: 10px;

            background: #ffffff;

            color: #0b0f14;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;

        }


        .submit-button:hover {

            transform:
                translateY(-1px);

        }


        .submit-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =========================================
           RESULT
        ========================================== */

        .puzzle-result {

            grid-column: 1 / -1;

            grid-row: 1 / -1;

            width: 100%;

            height: 100%;

            border-radius: 10px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 18px;

            overflow: hidden;

        }


        /* =========================================
           SUCCESS
        ========================================== */

        .puzzle-result.success {

            background:
                #13291c;

            border:
                2px solid #2c7a47;

        }


        .puzzle-result.success .result-title {

            color: #7dffad;

        }


        .result-title {

            font-size:
                clamp(22px, 5vw, 32px);

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 7px;

        }


        .result-time {

            font-size:
                clamp(14px, 3vw, 19px);

            color: #dce5df;

            margin-bottom: 12px;

        }


        .result-message {

            font-size:
                clamp(12px, 2.5vw, 15px);

            color: #b9c2cc;

            line-height: 1.4;

        }


        /* =========================================
           MAVELI
        ========================================== */

        .maveli-image {

            width: 72%;

            height: 52%;

            object-fit: contain;

            display: block;

            margin: 4px 0 10px;

            border-radius: 8px;

        }


        /* =========================================
           FAILURE
        ========================================== */

        .puzzle-result.failure {

            background:
                #2b1717;

            border:
                2px solid #8a3939;

        }


        .puzzle-result.failure .result-title {

            color: #ff7777;

        }


        .attempt-over {

            margin-top: 12px;

            padding: 7px 13px;

            border-radius: 7px;

            background:
                rgba(255,255,255,0.07);

            color: #ffffff;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        /* =========================================
           LOADING
        ========================================== */

        .loading {

            opacity: 0.6;

            pointer-events: none;

        }


        /* =========================================
           INSTRUCTIONS
        ========================================== */

        .instructions {

            margin-top: 10px;

            color: #778392;

            font-size: 11px;

            line-height: 1.45;

        }


        .instructions strong {

            color: #aeb8c4;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 520px) {

            body {

                padding: 10px;

                align-items: flex-start;

            }


            .container {

                padding-top: 6px;

            }


            .subtitle {

                margin-bottom: 12px;

            }


            .top-bar {

                margin-bottom: 10px;

            }


            .puzzle-wrapper {

                width: 94vw;

            }


            .puzzle {

                gap: 4px;

                padding: 4px;

                border-radius: 12px;

            }


            .tile {

                border-radius: 7px;

            }


            .submit-button {

                margin-top: 9px;

                padding: 11px;

            }


            .instructions {

                margin-top: 7px;

                font-size: 10px;

            }


            .maveli-image {

                width: 80%;

                height: 55%;

            }

        }

    </style>

</head>


<body>


<main class="container">


    <div class="eyebrow">
        IEEE Sensors Council
    </div>


    <h1>
        Sensor Quest
    </h1>


    <p class="subtitle">
        Arrange the sensors by communication protocol.
    </p>


    <!-- =========================================
         LOGIN SCREEN
    ========================================== -->

    <div id="loginScreen">

        <input
            id="userIdInput"
            type="text"
            placeholder="Enter User ID"
            autocomplete="off"
        >


        <button
            class="submit-button"
            id="startButton"
            type="button"
        >
            START PUZZLE
        </button>


        <p id="loginMessage"></p>

    </div>


    <!-- =========================================
         GAME SCREEN
    ========================================== -->

    <div
        class="puzzle-wrapper"
        id="gameScreen"
        style="display: none;"
    >


        <div id="welcomeMessage"></div>


        <div class="top-bar">

            <div class="timer-box">

                Time:

                <strong id="timer">
                    00:00.00
                </strong>

            </div>

        </div>


        <!-- =========================================
             PUZZLE
        ========================================== -->

        <div
            class="puzzle"
            id="puzzle"
        >


            <!-- I²C -->

            <div
                class="tile"
                draggable="true"
                data-id="pc1"
                data-protocol="i2c"
            >

                <img
                    src="pc1.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc2"
                data-protocol="i2c"
            >

                <img
                    src="pc2.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc3"
                data-protocol="i2c"
            >

                <img
                    src="pc3.webp"
                    alt="I2C sensor"
                >

            </div>


            <!-- 1-WIRE -->

            <div
                class="tile"
                draggable="true"
                data-id="onewire1"
                data-protocol="onewire"
            >

                <img
                    src="1-wire1.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire2"
                data-protocol="onewire"
            >

                <img
                    src="1-wire2.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire3"
                data-protocol="onewire"
            >

                <img
                    src="1-wire3.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <!-- UART -->

            <div
                class="tile"
                draggable="true"
                data-id="uart1"
                data-protocol="uart"
            >

                <img
                    src="uart1.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart2"
                data-protocol="uart"
            >

                <img
                    src="uart2.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart3"
                data-protocol="uart"
            >

                <img
                    src="uart3.webp"
                    alt="UART sensor"
                >

            </div>

        </div>


        <button
            class="submit-button"
            id="submitButton"
            type="button"
        >
            SUBMIT PUZZLE
        </button>


        <p class="instructions">

            <strong>Desktop:</strong>
            drag one tile onto another to swap.

            <br>

            <strong>Phone:</strong>
            tap one tile, then tap another tile to swap.

        </p>


    </div>


</main>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

/*
 * IMPORTANT:
 *
 * Replace ONLY the text below.
 *
 * It must look like:
 *
 * https://script.google.com/macros/s/XXXXXXXXXXXX/exec
 *
 * Do NOT put the Google Apps Script editor URL here.
 */

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxMjUaXm4xjNxdlDrXZOC-oMN4qPu_UPOFkDqdrqzTsyPsGBanhVZGBxRfIkrtAQS-Ciw/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const puzzle =
    document.getElementById("puzzle");

const submitButton =
    document.getElementById("submitButton");

const timerDisplay =
    document.getElementById("timer");

const loginScreen =
    document.getElementById("loginScreen");

const gameScreen =
    document.getElementById("gameScreen");

const userIdInput =
    document.getElementById("userIdInput");

const startButton =
    document.getElementById("startButton");

const loginMessage =
    document.getElementById("loginMessage");

const welcomeMessage =
    document.getElementById("welcomeMessage");


/* =========================================================
   GAME STATE
========================================================= */

let draggedTile = null;

let selectedTile = null;

let submitted = false;

let currentUserId = "";

let currentUserName = "";

let moveCount = 0;

let gameStarted = false;


/* =========================================================
   TIMER
========================================================= */

let startTime = 0;

let timerRunning = false;


function updateTimer() {

    if (!timerRunning) {
        return;
    }


    const elapsed =
        performance.now() -
        startTime;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    const seconds =
        Math.floor(
            (elapsed % 60000) / 1000
        );


    const milliseconds =
        Math.floor(
            elapsed % 1000
        );


    timerDisplay.textContent =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0")

        + "." +

        String(milliseconds)
            .padStart(3, "0")
            .slice(0, 2);


    requestAnimationFrame(
        updateTimer
    );

}


/* =========================================================
   API
========================================================= */

async function callAPI(payload) {

    if (
        !SCRIPT_URL ||
        SCRIPT_URL.includes(
            "PASTE_YOUR_APPS_SCRIPT"
        )
    ) {

        throw new Error(
            "Apps Script URL has not been configured."
        );

    }


    const response =
        await fetch(
            SCRIPT_URL,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "Empty response from Apps Script."
        );

    }


    try {

        return JSON.parse(text);

    }

    catch (error) {

        console.error(
            "Apps Script returned:",
            text
        );

        throw new Error(
            "Apps Script returned an invalid response."
        );

    }

}


/* =========================================================
   RANDOMIZE PUZZLE
========================================================= */

function randomizePuzzle() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    for (
        let i = tiles.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            tiles[i],
            tiles[randomIndex]
        ] =
        [
            tiles[randomIndex],
            tiles[i]
        ];

    }


    tiles.forEach(
        function(tile) {

            puzzle.appendChild(tile);

        }
    );

}


/* =========================================================
   DRAG EVENTS
========================================================= */

function setupDragEvents(tile) {

    tile.addEventListener(
        "dragstart",
        function() {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            draggedTile = tile;

            tile.classList.add(
                "dragging"
            );

        }
    );


    tile.addEventListener(
        "dragend",
        function() {

            tile.classList.remove(
                "dragging"
            );

            draggedTile = null;


            document
                .querySelectorAll(".tile")
                .forEach(
                    function(item) {

                        item.classList.remove(
                            "drag-over"
                        );

                    }
                );

        }
    );


    tile.addEventListener(
        "dragover",
        function(event) {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            event.preventDefault();


            if (
                tile !== draggedTile
            ) {

                tile.classList.add(
                    "drag-over"
                );

            }

        }
    );


    tile.addEventListener(
        "dragleave",
        function() {

            tile.classList.remove(
                "drag-over"
            );

        }
    );


    tile.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            tile.classList.remove(
                "drag-over"
            );


            if (
                submitted ||
                !gameStarted ||
                !draggedTile ||
                draggedTile === tile
            ) {
                return;
            }


            swapTiles(
                draggedTile,
                tile
            );

        }
    );

}


/* =========================================================
   MOBILE TAP
========================================================= */

function setupTouchSelection(tile) {

    tile.addEventListener(
        "click",
        function() {

            if (
                submitted ||
                !gameStarted
            ) {
                return;
            }


            if (!selectedTile) {

                selectedTile = tile;

                tile.classList.add(
                    "selected"
                );

                return;

            }


            if (
                selectedTile === tile
            ) {

                tile.classList.remove(
                    "selected"
                );

                selectedTile = null;

                return;

            }


            swapTiles(
                selectedTile,
                tile
            );


            selectedTile.classList.remove(
                "selected"
            );

            selectedTile = null;

        }
    );

}


/* =========================================================
   SWAP
========================================================= */

function swapTiles(
    tileA,
    tileB
) {

    const placeholder =
        document.createElement(
            "div"
        );


    puzzle.insertBefore(
        placeholder,
        tileA
    );


    puzzle.insertBefore(
        tileA,
        tileB
    );


    puzzle.insertBefore(
        tileB,
        placeholder
    );


    puzzle.removeChild(
        placeholder
    );


    moveCount++;

}


/* =========================================================
   ARRANGEMENT
========================================================= */

function getArrangement() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    return tiles.map(
        function(tile) {

            return tile.dataset.protocol;

        }
    );

}


/* =========================================================
   LOCAL VALIDATION
========================================================= */

function validatePuzzle() {

    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    if (
        tiles.length !== 9
    ) {

        return false;

    }


    const rows = [

        tiles.slice(0, 3),

        tiles.slice(3, 6),

        tiles.slice(6, 9)

    ];


    const rowProtocols = [];


    for (
        const row of rows
    ) {

        const protocols =
            row.map(
                tile =>
                    tile.dataset.protocol
            );


        if (
            protocols[0] !==
            protocols[1] ||

            protocols[1] !==
            protocols[2]
        ) {

            return false;

        }


        rowProtocols.push(
            protocols[0]
        );

    }


    const required = [
        "i2c",
        "onewire",
        "uart"
    ];


    rowProtocols.sort();

    required.sort();


    return (
        JSON.stringify(
            rowProtocols
        ) ===
        JSON.stringify(
            required
        )
    );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    finalTime
) {

    puzzle.innerHTML = `

        <div class="puzzle-result success">

            <div class="result-title">
                ✓ PUZZLE SOLVED
            </div>

            <div class="result-time">
                Completed in ${finalTime} seconds
            </div>

            <img
                class="maveli-image"
                src="maveli.webp"
                alt="Maveli"
            >

            <div class="result-message">
                Congratulations!
            </div>

        </div>

    `;

}


/* =========================================================
   FAILURE
========================================================= */

function showFailure() {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ INCORRECT
            </div>

            <div class="result-message">
                The sensor arrangement
                is incorrect.
            </div>

            <div class="attempt-over">
                ATTEMPT OVER
            </div>

        </div>

    `;

}


/* =========================================================
   ALREADY USED
========================================================= */

function showAlreadyUsed() {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ ALREADY USED
            </div>

            <div class="result-message">
                This User ID has already
                submitted an attempt.
            </div>

        </div>

    `;

}


/* =========================================================
   SERVER ERROR
========================================================= */

function showServerError(message) {

    puzzle.innerHTML = `

        <div class="puzzle-result failure">

            <div class="result-title">
                ✕ SUBMISSION ERROR
            </div>

            <div class="result-message">
                ${message}
            </div>

        </div>

    `;

}


/* =========================================================
   START PUZZLE
========================================================= */

function startPuzzle() {

    loginScreen.style.display =
        "none";


    gameScreen.style.display =
        "block";


    welcomeMessage.textContent =
        "Welcome, " +
        currentUserName +
        "!";


    submitted = false;

    selectedTile = null;

    draggedTile = null;

    moveCount = 0;

    gameStarted = false;


    submitButton.disabled =
        false;


    randomizePuzzle();


    initializeTiles();


    startTime =
        performance.now();


    timerRunning = true;

    gameStarted = true;


    updateTimer();

}


/* =========================================================
   LOGIN
========================================================= */

startButton.addEventListener(
    "click",
    async function() {

        const userId =
            userIdInput.value
                .trim();


        loginMessage.textContent =
            "";


        if (!userId) {

            loginMessage.textContent =
                "Please enter a User ID.";

            return;

        }


        startButton.disabled =
            true;

        startButton.classList.add(
            "loading"
        );

        startButton.textContent =
            "CHECKING...";


        try {

            const result =
                await callAPI({

                    action:
                        "checkUser",

                    userId:
                        userId

                });


            if (
                !result ||
                !result.success
            ) {

                if (
                    result &&
                    result.alreadyPlayed
                ) {

                    loginMessage.textContent =
                        "This User ID has already been used.";

                }

                else {

                    loginMessage.textContent =
                        result &&
                        result.message
                            ? result.message
                            : "Unable to verify User ID.";

                }

                return;

            }


            currentUserId =
                result.userId;

            currentUserName =
                result.name;


            startPuzzle();

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.textContent =
                error.message ===
                "Apps Script URL has not been configured."

                    ? "Apps Script URL has not been added to the HTML."

                    : "Unable to connect to the server. Check the Apps Script deployment.";

        }

        finally {

            startButton.disabled =
                false;

            startButton.classList.remove(
                "loading"
            );

            startButton.textContent =
                "START PUZZLE";

        }

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

userIdInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startButton.click();

        }

    }
);


/* =========================================================
   SUBMIT PUZZLE
========================================================= */

submitButton.addEventListener(
    "click",
    async function() {

        if (
            submitted ||
            !gameStarted
        ) {

            return;

        }


        timerRunning = false;


        const elapsed =
            performance.now() -
            startTime;


        const finalTime =
            Number(
                (
                    elapsed / 1000
                ).toFixed(2)
            );


        const arrangement =
            getArrangement();


        const locallyCorrect =
            validatePuzzle();


        submitted = true;

        gameStarted = false;

        submitButton.disabled =
            true;


        submitButton.textContent =
            "SUBMITTING...";


        try {

            const result =
                await callAPI({

                    action:
                        "submitResult",

                    result: {

                        userId:
                            currentUserId,

                        time:
                            finalTime,

                        moves:
                            moveCount,

                        arrangement:
                            arrangement

                    }

                });


            if (
                result &&
                result.success
            ) {

                if (
                    result.status ===
                    "SUCCESS"
                ) {

                    showSuccess(
                        result.time
                    );

                }

                else {

                    showFailure();

                }


                return;

            }


            if (
                result &&
                result.alreadyPlayed
            ) {

                showAlreadyUsed();

                return;

            }


            showServerError(
                result &&
                result.message
                    ? result.message
                    : "Unable to save your result."
            );


            console.error(
                "Submission rejected:",
                result
            );

        }

        catch (error) {

            console.error(
                "Submission error:",
                error
            );


            showServerError(
                "Your result could not be submitted. Please contact the event organizers."
            );

        }

    }
);


/* =========================================================
   INITIALIZE TILES
========================================================= */

function initializeTiles() {

    const tiles =
        puzzle.querySelectorAll(
            ".tile"
        );


    tiles.forEach(
        function(tile) {

            setupDragEvents(
                tile
            );

            setupTouchSelection(
                tile
            );

        }
    );

}

</script>
