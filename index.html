<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IEEE Sensors Council — Sensor Puzzle</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #0b0f14;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 16px;

        }


        .container {

            width: 100%;

            max-width: 720px;

            text-align: center;

        }


        .eyebrow {

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.55;

            margin-bottom: 8px;

        }


        h1 {

            font-size:
                clamp(27px, 5vw, 42px);

            margin-bottom: 6px;

        }


        .subtitle {

            color: #9da7b3;

            font-size: 14px;

            margin-bottom: 16px;

        }


        /* =========================================
           TIMER
        ========================================== */

        .top-bar {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 14px;

        }


        .timer-box {

            background: #171d25;

            border: 1px solid #29313c;

            border-radius: 10px;

            padding: 8px 14px;

            font-size: 12px;

            color: #9da7b3;

        }


        .timer-box strong {

            color: #ffffff;

            font-size: 14px;

        }


        /* =========================================
           PUZZLE
        ========================================== */

        .puzzle-wrapper {

            width:
                min(92vw, 570px);

            margin: 0 auto;

        }


        .puzzle {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            padding: 7px;

            background: #171d25;

            border: 1px solid #29313c;

            border-radius: 16px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.4);

        }


        /* =========================================
           TILES
        ========================================== */

        .tile {

            aspect-ratio: 1 / 1;

            background: #202833;

            border: 1px solid #343e4b;

            border-radius: 10px;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: grab;

            user-select: none;

            -webkit-user-select: none;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;

        }


        .tile img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

            pointer-events: none;

        }


        .tile:hover {

            transform:
                translateY(-2px);

            border-color:
                #667384;

        }


        .tile:active {

            cursor: grabbing;

        }


        .tile.dragging {

            opacity: 0.35;

            transform:
                scale(0.95);

        }


        .tile.drag-over {

            border-color:
                #ffffff;

            transform:
                scale(0.96);

        }


        .tile.selected {

            border-color:
                #ffffff;

            box-shadow:
                0 0 0 2px
                rgba(255,255,255,0.18);

            transform:
                scale(0.96);

        }


        /* =========================================
           SUBMIT
        ========================================== */

        .submit-button {

            width: 100%;

            max-width: 570px;

            margin-top: 13px;

            padding: 13px 20px;

            border: none;

            border-radius: 10px;

            background: #ffffff;

            color: #0b0f14;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;

        }


        .submit-button:hover {

            transform:
                translateY(-1px);

        }


        .submit-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =========================================
           RESULT
        ========================================== */

        .result {

            width: 100%;

            max-width: 570px;

            margin: 12px auto 0;

            padding: 14px;

            border-radius: 12px;

            display: none;

        }


        .result.success {

            display: block;

            background: #13291c;

            border: 1px solid #2c7a47;

        }


        .result.failure {

            display: block;

            background: #2b1717;

            border: 1px solid #8a3939;

        }


        .result-title {

            font-size: 21px;

            font-weight: 800;

            margin-bottom: 4px;

        }


        .result-text {

            color: #b9c2cc;

            font-size: 13px;

            line-height: 1.4;

        }


        /* =========================================
           MAVELI IMAGE
        ========================================== */

        .reveal {

            display: none;

            width: 100%;

            max-width: 570px;

            margin: 12px auto 0;

            border-radius: 14px;

            overflow: hidden;

            border: 1px solid #343e4b;

            background: #171d25;

        }


        .reveal.show {

            display: block;

        }


        .reveal img {

            width: 100%;

            display: block;

        }


        /* =========================================
           INSTRUCTIONS
        ========================================== */

        .instructions {

            margin-top: 10px;

            color: #778392;

            font-size: 11px;

            line-height: 1.45;

        }


        .instructions strong {

            color: #aeb8c4;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 520px) {

            body {

                padding: 10px;

                align-items: flex-start;

            }


            .container {

                padding-top: 6px;

            }


            .subtitle {

                margin-bottom: 12px;

            }


            .top-bar {

                margin-bottom: 10px;

            }


            .puzzle-wrapper {

                width: 94vw;

            }


            .puzzle {

                gap: 4px;

                padding: 4px;

                border-radius: 12px;

            }


            .tile {

                border-radius: 7px;

            }


            .submit-button {

                margin-top: 9px;

                padding: 11px;

            }


            .result {

                margin-top: 9px;

                padding: 11px;

            }


            .result-title {

                font-size: 18px;

            }


            .instructions {

                margin-top: 7px;

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


<main class="container">


    <div class="eyebrow">
        IEEE Sensors Council
    </div>


    <h1>
        Sensor Puzzle
    </h1>


    <p class="subtitle">
        Arrange the sensors by communication protocol.
    </p>


    <!-- =========================================
         TIMER
    ========================================== -->

    <div class="top-bar">

        <div class="timer-box">

            Time:

            <strong id="timer">
                00:00.00
            </strong>

        </div>

    </div>


    <!-- =========================================
         PUZZLE
    ========================================== -->

    <div class="puzzle-wrapper">


        <div
            class="puzzle"
            id="puzzle"
        >


            <!-- =========================
                 I²C — 3 PIECES
            ========================== -->


            <div
                class="tile"
                draggable="true"
                data-id="pc1"
                data-protocol="i2c"
            >

                <img
                    src="pc1.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc2"
                data-protocol="i2c"
            >

                <img
                    src="pc2.webp"
                    alt="I2C sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="pc3"
                data-protocol="i2c"
            >

                <img
                    src="pc3.webp"
                    alt="I2C sensor"
                >

            </div>



            <!-- =========================
                 1-WIRE — 3 PIECES
            ========================== -->


            <div
                class="tile"
                draggable="true"
                data-id="onewire1"
                data-protocol="onewire"
            >

                <img
                    src="1-wire1.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire2"
                data-protocol="onewire"
            >

                <img
                    src="1-wire2.webp"
                    alt="1-Wire sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="onewire3"
                data-protocol="onewire"
            >

                <img
                    src="1-wire3.webp"
                    alt="1-Wire sensor"
                >

            </div>



            <!-- =========================
                 UART — 3 PIECES
            ========================== -->


            <div
                class="tile"
                draggable="true"
                data-id="uart1"
                data-protocol="uart"
            >

                <img
                    src="uart1.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart2"
                data-protocol="uart"
            >

                <img
                    src="uart2.webp"
                    alt="UART sensor"
                >

            </div>


            <div
                class="tile"
                draggable="true"
                data-id="uart3"
                data-protocol="uart"
            >

                <img
                    src="uart3.webp"
                    alt="UART sensor"
                >

            </div>


        </div>


        <!-- =========================================
             SUBMIT
        ========================================== -->

        <button
            class="submit-button"
            id="submitButton"
        >
            SUBMIT PUZZLE
        </button>


        <!-- =========================================
             RESULT
        ========================================== -->

        <div
            class="result"
            id="result"
        >

            <div
                class="result-title"
                id="resultTitle"
            ></div>

            <div
                class="result-text"
                id="resultText"
            ></div>

        </div>


        <!-- =========================================
             MAVELI REVEAL
        ========================================== -->

        <div
            class="reveal"
            id="reveal"
        >

            <img
                src="maveli.webp"
                alt="Maveli"
            >

        </div>


        <p class="instructions">

            <strong>Desktop:</strong>
            drag one tile onto another to swap.

            <br>

            <strong>Phone:</strong>
            tap one tile, then tap another tile to swap.

        </p>


    </div>


</main>



<script>


/* =========================================
   VARIABLES
========================================= */


const puzzle =
    document.getElementById(
        "puzzle"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const result =
    document.getElementById(
        "result"
    );


const resultTitle =
    document.getElementById(
        "resultTitle"
    );


const resultText =
    document.getElementById(
        "resultText"
    );


const reveal =
    document.getElementById(
        "reveal"
    );


const timerDisplay =
    document.getElementById(
        "timer"
    );


let draggedTile = null;

let selectedTile = null;


/*
 * Timer starts when the
 * puzzle loads.
 */

let startTime =
    performance.now();


let timerRunning = true;


/*
 * Only one submission
 * is allowed.
 */

let submitted = false;



/* =========================================
   RANDOMIZE
========================================= */

function randomizePuzzle() {


    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    /*
     * Fisher-Yates shuffle
     */

    for (
        let i = tiles.length - 1;
        i > 0;
        i--
    ) {


        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            tiles[i],
            tiles[randomIndex]
        ] =
        [
            tiles[randomIndex],
            tiles[i]
        ];

    }


    tiles.forEach(
        function(tile) {

            puzzle.appendChild(
                tile
            );

        }
    );

}



/* =========================================
   TIMER
========================================= */

function updateTimer() {


    if (!timerRunning) {

        return;

    }


    const elapsed =
        performance.now() -
        startTime;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    const seconds =
        Math.floor(
            (elapsed % 60000) /
            1000
        );


    const milliseconds =
        Math.floor(
            elapsed % 1000
        );


    timerDisplay.textContent =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0")

        + "." +

        String(milliseconds)
            .padStart(3, "0")
            .slice(0, 2);


    requestAnimationFrame(
        updateTimer
    );

}



/* =========================================
   DESKTOP DRAG
========================================= */

function setupDragEvents(tile) {


    tile.addEventListener(
        "dragstart",
        function() {


            if (submitted) {

                return;

            }


            draggedTile =
                tile;


            tile.classList.add(
                "dragging"
            );

        }
    );


    tile.addEventListener(
        "dragend",
        function() {


            tile.classList.remove(
                "dragging"
            );


            draggedTile =
                null;


            document
                .querySelectorAll(
                    ".tile"
                )
                .forEach(
                    function(item) {


                        item.classList.remove(
                            "drag-over"
                        );

                    }
                );

        }
    );


    tile.addEventListener(
        "dragover",
        function(event) {


            if (submitted) {

                return;

            }


            event.preventDefault();


            if (
                tile !== draggedTile
            ) {


                tile.classList.add(
                    "drag-over"
                );

            }

        }
    );


    tile.addEventListener(
        "dragleave",
        function() {


            tile.classList.remove(
                "drag-over"
            );

        }
    );


    tile.addEventListener(
        "drop",
        function(event) {


            event.preventDefault();


            tile.classList.remove(
                "drag-over"
            );


            if (
                submitted ||
                !draggedTile ||
                draggedTile === tile
            ) {

                return;

            }


            swapTiles(
                draggedTile,
                tile
            );

        }
    );

}



/* =========================================
   MOBILE TAP
========================================= */

function setupTouchSelection(tile) {


    tile.addEventListener(
        "click",
        function() {


            if (submitted) {

                return;

            }


            /*
             * First tile selected.
             */

            if (!selectedTile) {


                selectedTile =
                    tile;


                tile.classList.add(
                    "selected"
                );


                return;

            }


            /*
             * Same tile = deselect.
             */

            if (
                selectedTile === tile
            ) {


                tile.classList.remove(
                    "selected"
                );


                selectedTile =
                    null;


                return;

            }


            /*
             * Second tile = swap.
             */

            swapTiles(
                selectedTile,
                tile
            );


            selectedTile.classList.remove(
                "selected"
            );


            selectedTile =
                null;

        }
    );

}



/* =========================================
   SWAP
========================================= */

function swapTiles(
    tileA,
    tileB
) {


    const placeholder =
        document.createElement(
            "div"
        );


    puzzle.insertBefore(
        placeholder,
        tileA
    );


    puzzle.insertBefore(
        tileA,
        tileB
    );


    puzzle.insertBefore(
        tileB,
        placeholder
    );


    puzzle.removeChild(
        placeholder
    );

}



/* =========================================
   VALIDATION
========================================= */

/*
 * VALID SOLUTION:
 *
 * Row 1 = all I²C
 * Row 2 = all 1-Wire
 * Row 3 = all UART
 *
 * OR
 *
 * Row 1 = all UART
 * Row 2 = all I²C
 * Row 3 = all 1-Wire
 *
 * etc.
 *
 * Row order DOES NOT matter.
 *
 * Order within a row DOES NOT matter.
 */

function validatePuzzle() {


    const tiles =
        Array.from(
            puzzle.querySelectorAll(
                ".tile"
            )
        );


    /*
     * Divide the 9 positions
     * into three rows.
     */

    const rows = [

        tiles.slice(0, 3),

        tiles.slice(3, 6),

        tiles.slice(6, 9)

    ];


    const rowProtocols = [];


    /*
     * Check each row.
     */

    for (
        const row of rows
    ) {


        const protocols =
            row.map(
                tile =>
                    tile.dataset.protocol
            );


        /*
         * All 3 tiles in this
         * row must have the
         * same protocol.
         */

        if (
            !(
                protocols[0] ===
                protocols[1]

                &&

                protocols[1] ===
                protocols[2]
            )
        ) {


            return false;

        }


        rowProtocols.push(
            protocols[0]
        );

    }


    /*
     * The three rows must
     * contain the three
     * different protocols.
     */

    const requiredProtocols = [

        "i2c",

        "onewire",

        "uart"

    ];


    rowProtocols.sort();

    requiredProtocols.sort();


    return (

        rowProtocols[0] ===
        requiredProtocols[0]

        &&

        rowProtocols[1] ===
        requiredProtocols[1]

        &&

        rowProtocols[2] ===
        requiredProtocols[2]

    );

}



/* =========================================
   SUBMIT
========================================= */

submitButton.addEventListener(
    "click",
    function() {


        /*
         * Prevent second attempt.
         */

        if (submitted) {

            return;

        }


        /*
         * Check solution.
         */

        const correct =
            validatePuzzle();


        /*
         * Stop timer.
         */

        timerRunning =
            false;


        /*
         * Lock puzzle.
         */

        submitted =
            true;


        submitButton.disabled =
            true;


        /*
         * Calculate final time.
         */

        const elapsed =
            performance.now() -
            startTime;


        const finalTime =
            (elapsed / 1000)
                .toFixed(2);



        /* =================================
           SUCCESS
        ================================= */

        if (correct) {


            result.className =
                "result success";


            resultTitle.textContent =
                "PUZZLE SOLVED";


            resultText.textContent =

                "Congratulations! " +

                "You completed the puzzle in " +

                finalTime +

                " seconds.";


            /*
             * Reveal Maveli.
             */

            reveal.classList.add(
                "show"
            );

        }



        /* =================================
           FAILURE
        ================================= */

        else {


            result.className =
                "result failure";


            resultTitle.textContent =
                "INCORRECT";


            resultText.textContent =

                "The sensor arrangement " +
                "is incorrect. " +
                "This attempt is over.";


            /*
             * Keep Maveli hidden.
             */

            reveal.classList.remove(
                "show"
            );

        }


        /*
         * Bring the result into
         * view without jumping
         * the page unnecessarily.
         */

        result.scrollIntoView({

            behavior: "smooth",

            block: "nearest"

        });

    }
);



/* =========================================
   INITIALIZE
========================================= */

function initializeTiles() {


    const tiles =
        document.querySelectorAll(
            ".tile"
        );


    tiles.forEach(
        function(tile) {


            setupDragEvents(
                tile
            );


            setupTouchSelection(
                tile
            );

        }
    );

}


/*
 * Randomize puzzle.
 */

randomizePuzzle();


/*
 * Enable interactions.
 */

initializeTiles();


/*
 * Start timer.
 */

updateTimer();


</script>


</body>

</html>
